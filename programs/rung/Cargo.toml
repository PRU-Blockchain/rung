[package]
name = "rung"
version = "0.1.0"
description = "Rung: tries rising slippage rungs up to a cap and buys at most once"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "rung"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
# Already in Cargo.lock through litesvm: `Account` for `set_account`, `TransactionError` for error checks.
solana-account = "3.4.0"
solana-transaction-error = "3.4.0"
# Test double loaded at pump's address; linked only for its discriminator and quote helper.
mock-pump = { path = "../../test-programs/mock-pump", features = ["no-entrypoint"] }
# Already in Cargo.lock: read the mainnet fixtures of tests/real_pump.rs.
serde_json = "1"
base64 = "0.22"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
